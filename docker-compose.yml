services:
  postgres:
    image: postgres:16-alpine
    container_name: dataroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dataroom
      POSTGRES_PASSWORD: dataroom
      POSTGRES_DB: dataroom
    ports:
      - "5432:5432"
    volumes:
      - dataroom-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataroom -d dataroom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dataroom-postgres-data:
